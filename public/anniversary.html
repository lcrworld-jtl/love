  <style>
    body[data-page="anniv"] {
      background: linear-gradient(180deg, #fff5f7 0%, #ffe8ee 100%);
      min-height: 100vh;
      padding-bottom: 60px;
    }
    body[data-page="anniv"] .anniv-wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: 20px 16px 0;
      position: relative;
      z-index: 2;
    }
    body[data-page="anniv"] .anniv-home {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--card-bg);
      color: var(--text-secondary);
      font-size: 13px; text-decoration: none;
      transition: all 0.2s;
      margin-bottom: 18px;
    }
    body[data-page="anniv"] .anniv-home:hover { border-color: var(--primary); color: var(--primary); }
    body[data-page="anniv"] .anniv-home svg { width: 14px; height: 14px; }

    body[data-page="anniv"] h1.anniv-title {
      font-size: 28px; font-weight: 800; color: var(--primary-dark);
      margin: 0 0 6px; letter-spacing: 2px;
    }
    body[data-page="anniv"] .anniv-sub {
      font-size: 13px; color: var(--text-secondary); margin-bottom: 24px;
    }

    /* ===== 主卡片：在一起实时计时 ===== */
    body[data-page="anniv"] .together-card {
      background: linear-gradient(135deg, #FF6B9D 0%, #FF8FB1 100%);
      color: #fff;
      border-radius: 22px;
      padding: 32px 26px;
      margin-bottom: 26px;
      box-shadow: 0 14px 38px rgba(255,107,157,0.32);
      position: relative;
      overflow: hidden;
    }
    body[data-page="anniv"] .together-card::before {
      content: '💗';
      position: absolute; right: 16px; top: 10px;
      font-size: 90px; opacity: 0.16;
      animation: heartbeat 1.6s ease-in-out infinite;
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      14% { transform: scale(1.12); }
      28% { transform: scale(1); }
      42% { transform: scale(1.08); }
    }
    body[data-page="anniv"] .together-card .tc-label {
      font-size: 13px; opacity: 0.92; letter-spacing: 2px; margin-bottom: 4px;
    }
    body[data-page="anniv"] .together-card .tc-date {
      font-size: 14px; opacity: 0.95; margin-bottom: 18px;
    }
    body[data-page="anniv"] .together-card .tc-days {
      font-size: 62px; font-weight: 800; line-height: 1; margin-bottom: 6px;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 2px 12px rgba(0,0,0,0.12);
    }
    body[data-page="anniv"] .together-card .tc-days .unit {
      font-size: 18px; font-weight: 500; margin-left: 8px; opacity: 0.9;
    }
    body[data-page="anniv"] .together-card .tc-seconds {
      font-size: 15px; opacity: 0.95; font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
      padding: 6px 12px;
      background: rgba(255,255,255,0.18);
      border-radius: 8px;
      display: inline-block;
      margin-top: 4px;
    }
    body[data-page="anniv"] .together-empty {
      background: var(--card-bg);
      border: 1px dashed var(--border);
      border-radius: 20px;
      padding: 36px 20px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 26px;
    }

    /* ===== 倒计时网格 ===== */
    body[data-page="anniv"] .countdown-head {
      display: flex; align-items: center; gap: 10px;
      margin: 8px 0 16px;
    }
    body[data-page="anniv"] .countdown-head .ch-line {
      flex: 1; height: 1px;
      background: linear-gradient(90deg, var(--border), transparent);
    }
    body[data-page="anniv"] .countdown-head .ch-title {
      font-size: 15px; font-weight: 700; color: var(--primary-dark);
      letter-spacing: 1px;
    }
    body[data-page="anniv"] .countdown-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }
    body[data-page="anniv"] .countdown-card {
      position: relative;
      border-radius: 18px;
      padding: 22px 20px;
      color: #fff;
      overflow: hidden;
      box-shadow: 0 8px 22px rgba(0,0,0,0.10);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      min-height: 140px;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    body[data-page="anniv"] .countdown-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 32px rgba(0,0,0,0.16);
    }
    body[data-page="anniv"] .countdown-card .cc-bg-icon {
      position: absolute; right: -10px; bottom: -16px;
      font-size: 90px; opacity: 0.18;
      pointer-events: none;
    }
    body[data-page="anniv"] .countdown-card .cc-top {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; opacity: 0.9; letter-spacing: 1px;
      position: relative; z-index: 1;
    }
    body[data-page="anniv"] .countdown-card .cc-top .cc-emoji { font-size: 18px; }
    body[data-page="anniv"] .countdown-card .cc-title {
      font-size: 16px; font-weight: 700; margin-top: 4px;
      position: relative; z-index: 1;
    }
    body[data-page="anniv"] .countdown-card .cc-date {
      font-size: 11px; opacity: 0.85; margin-top: 2px;
      position: relative; z-index: 1;
    }
    body[data-page="anniv"] .countdown-card .cc-days {
      font-size: 36px; font-weight: 800; line-height: 1;
      margin-top: 14px;
      font-variant-numeric: tabular-nums;
      position: relative; z-index: 1;
      text-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    body[data-page="anniv"] .countdown-card .cc-days .unit {
      font-size: 14px; font-weight: 500; margin-left: 4px; opacity: 0.9;
    }
    body[data-page="anniv"] .countdown-card.cc-today {
      animation: pulseToday 1.8s ease-in-out infinite;
    }
    body[data-page="anniv"] .countdown-card.cc-today .cc-days {
      font-size: 22px;
    }
    @keyframes pulseToday {
      0%, 100% { box-shadow: 0 8px 22px rgba(0,0,0,0.10); }
      50% { box-shadow: 0 14px 36px rgba(255,107,157,0.45); }
    }
    body[data-page="anniv"] .countdown-card.cc-past { opacity: 0.65; }

    /* 不同事件类型的渐变背景 */
    body[data-page="anniv"] .countdown-card.grad-anniversary {
      background: linear-gradient(135deg, #FF6B9D 0%, #FF8FB1 100%);
    }
    body[data-page="anniv"] .countdown-card.grad-birthday {
      background: linear-gradient(135deg, #FFB347 0%, #FFCC70 100%);
    }
    body[data-page="anniv"] .countdown-card.grad-custom {
      background: linear-gradient(135deg, #A18CD1 0%, #FBC2EB 100%);
    }

    body[data-page="anniv"] .empty-grid {
      text-align: center; padding: 30px 20px; color: var(--text-secondary);
      font-size: 13px;
      background: var(--card-bg); border: 1px dashed var(--border);
      border-radius: 16px;
    }

    @media (max-width: 600px) {
      body[data-page="anniv"] .together-card { padding: 24px 20px; }
      body[data-page="anniv"] .together-card .tc-days { font-size: 48px; }
      body[data-page="anniv"] h1.anniv-title { font-size: 24px; }
      body[data-page="anniv"] .countdown-card .cc-days { font-size: 30px; }
    }
  </style>
