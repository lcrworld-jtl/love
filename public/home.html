<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Love - 首页</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="home">
  <noscript><div style="padding:16px;text-align:center;background:#fff0f0;color:#c00;font-size:14px">请开启 JavaScript 以获得最佳浏览体验。</div></noscript>

  <!-- 申请表单 -->
  <div class="apply-overlay" id="apply-overlay"></div>
  <div class="apply-modal" id="apply-modal">
    <div class="apply-header">
      <span class="apply-title" id="apply-title">申请</span>
      <button class="apply-close" id="apply-close-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="apply-form-body"></div>
    <div class="apply-success" id="apply-success" style="display:none">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
      <div class="apply-success-text">申请已提交</div>
      <div class="apply-success-sub">等待审核中，祝你好运</div>
    </div>
  </div>

  <!-- 返回顶部 -->
  <button class="back-top" id="back-top">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
  </button>

  <!-- 主站点容器 -->
  <div id="app">

    <!-- Hero 区域 -->
    <header class="hero" id="hero">
      <div class="hero-inner">
        <h1 class="title" id="page-title">Love</h1>
        <p class="subtitle" id="page-subtitle">关于爱的一些想法</p>
        <div class="hero-entries">
          <a href="/lover" class="hero-entry">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            <span>特别的人</span>
          </a>
          <a href="/capsule" class="hero-entry">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
            <span>时间胶囊</span>
          </a>
          <a href="/stars" class="hero-entry">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 16.8 5.8 21.3l2.4-7.4L2 9.4h7.6z"/></svg>
            <span>星空许愿</span>
          </a>
          <a href="/anniversary" class="hero-entry">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
            <span>纪念日</span>
          </a>
          <a href="/bucket-list" class="hero-entry">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm-2 14l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
            <span>愿望清单</span>
          </a>
        </div>
        <div class="hero-scroll-hint">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>
    </header>

    <!-- 导航栏 -->
    <nav class="site-nav" id="nav"></nav>

    <!-- 内容区 -->
    <main class="main" id="content"></main>

    <!-- 页脚 -->
    <footer class="site-footer">
      <div class="footer-divider"></div>
      <div class="footer-content">
        <span class="footer-text">Made with </span>
        <svg class="footer-heart" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        <span class="footer-text"> by 井天乐</span>
      </div>
      <details class="footer-collapse">
        <summary>更多页面</summary>
        <div class="footer-links">
          <a href="/lover" class="footer-link">特别的人</a>
          <a href="/capsule" class="footer-link">时间胶囊</a>
          <a href="/stars" class="footer-link">星空许愿</a>
          <a href="/anniversary" class="footer-link">纪念日</a>
          <a href="/gallery" class="footer-link">照片墙</a>
          <a href="/bucket-list" class="footer-link">愿望清单</a>
          <a href="/agreement" class="footer-link">君子协定</a>
          <a href="/admin" class="footer-link">管理</a>
        </div>
      </details>
      <div class="footer-icp">
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">冀ICP备2026028241号</a>
      </div>
    </footer>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/widgets.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
