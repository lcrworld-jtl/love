  <canvas id="sakura-canvas"></canvas>

  <div id="app">
    <header class="hero">
      <div class="hero-inner">
        <h1 class="title">时间胶囊</h1>
        <p class="subtitle">写给未来的信</p>
        <div class="hero-scroll-hint">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>
    </header>

    <main class="main" id="content">
      <!-- 创建胶囊表单 -->
      <div class="section">
        <div class="card">
          <div class="card-title">
            <svg viewBox="0 0 24 24" fill="currentColor" style="width:20px;height:20px"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/><path d="M12.5 7H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
            <span>埋下一颗胶囊</span>
          </div>
          <div class="capsule-form">
            <div class="form-row">
              <label>来自</label>
              <input type="text" id="cap-from" placeholder="你的名字（选填）" maxlength="30">
            </div>
            <div class="form-row">
              <label>致</label>
              <input type="text" id="cap-to" placeholder="未来的谁（选填）" maxlength="30">
            </div>
            <div class="form-row">
              <label>解锁时间</label>
              <input type="datetime-local" id="cap-unlock">
            </div>
            <div class="form-row">
              <label>胶囊内容</label>
              <textarea id="cap-content" placeholder="写下你想留给未来的话..." rows="6" maxlength="5000"></textarea>
            </div>
            <button class="capsule-submit" id="cap-submit">封存这颗胶囊</button>
            <div class="form-tip" id="cap-result"></div>
          </div>
        </div>
      </div>

      <!-- 已解锁的胶囊 -->
      <div class="section">
        <div class="card">
          <div class="card-title">
            <svg viewBox="0 0 24 24" fill="currentColor" style="width:20px;height:20px"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            <span>星河里的胶囊</span>
          </div>
          <div id="cap-opened"></div>
        </div>
      </div>
